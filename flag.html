<style>

  .flag{

  @keyframes flicker{

    92%{opacity:1}
    93%{opacity:.4}
    94%{opacity:.9}
    95%{opacity:.5}
    96%{opacity:1}
  }
  .glitch{position:relative}
  .glitch::after{
    content:attr(data-t);position:absolute;left:1px;top:0;color:#550000;opacity:.55;
    clip-path:inset(38% 0 42% 0);animation:jit 3.7s infinite steps(1);pointer-events:none
  }
  @keyframes jit{0%,88%,100%{transform:none;opacity:0}90%{transform:translateX(-2px);opacity:.6}94%{transform:translateX(2px);opacity:.4}96%{opacity:0}}
  .foot{margin-top:40px;font-size:11px;color:#3d0000;letter-spacing:.12em;display:flex;justify-content:space-between}
  a{color:#8a0000;text-decoration:none;border-bottom:1px dotted #5c0000}
  a:hover{color:#c10000;border-bottom-color:#c10000}
  @media (prefers-reduced-motion: reduce){
    .caret,.flag .b64,.glitch::after{animation:none}
